[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "void-pc"
version = "0.1.0"
description = "Персональный голосовой ассистент для управления ПК"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "psutil>=5.9",
    "aiogram>=3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
