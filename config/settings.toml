# Несекретные настройки. Секреты (токены, ключи) только в .env

[assistant]
name = "Void"        # имя ассистента, меняй свободно
language = "ru"

[paths]
# Папки, внутри которых инструменты имеют право работать.
# Относительные пути считаются от корня проекта. Первая папка = "домашняя":
# относительные пути в командах отсчитываются от неё.
allowed_roots = ["workspace"]
data_dir = "data"       # логи, база, корзина Jarvis (сюда инструменты не пускаются)

[limits]
tool_timeout_s = 30
confirm_timeout_s = 60
trash_retention_days = 30
cloud_tokens_per_day = 50000
cloud_tokens_per_month = 1000000
